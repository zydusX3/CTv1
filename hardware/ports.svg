<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="520" viewBox="0 0 1360 520"><rect width="100%" height="100%" fill="#fafbf7"/><defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,2 L10,5 L0,8 z" fill="#78909c"/></marker></defs><text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#1b2418">CTv1 plug-in ports</text><text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#546e7a">Same pin order on every board, so a module made for one board fits the others, and can be swapped for a better one later.</text><rect x="30" y="90" width="420" height="190" rx="10" fill="#ffffff" stroke="#b0bec5" stroke-width="1.5"/><text x="46" y="118" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#102027">GPS-6</text><text x="434" y="118" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#546e7a">1x6 2.54 mm header</text><rect x="46" y="134" width="58" height="36" rx="5" fill="#c62828"/><text x="75" y="148" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#ffffff">1</text><text x="75" y="163" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">VGPS</text><rect x="110" y="134" width="58" height="36" rx="5" fill="#263238"/><text x="139" y="148" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#ffffff">2</text><text x="139" y="163" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">GND</text><rect x="174" y="134" width="58" height="36" rx="5" fill="#1565c0"/><text x="203" y="148" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#ffffff">3</text><text x="203" y="163" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">TXD</text><rect x="238" y="134" width="58" height="36" rx="5" fill="#1565c0"/><text x="267" y="148" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#ffffff">4</text><text x="267" y="163" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">RXD</text><rect x="302" y="134" width="58" height="36" rx="5" fill="#c62828"/><text x="331" y="148" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#ffffff">5</text><text x="331" y="163" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">VBCKP</text><rect x="366" y="134" width="58" height="36" rx="5" fill="#1565c0"/><text x="395" y="148" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#ffffff">6</text><text x="395" y="163" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">PPS</text><text x="46" y="194" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#37474f">GPS module. TXD = module output to the MCU. VGPS is switched;</text><text x="46" y="210" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#37474f">VBCKP is always on (hot start).</text><text x="46" y="226" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#37474f">Fits: u-blox MAX-M10S breakout (default) · ATGM336H · Quectel L76K ·</text><text x="46" y="242" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#37474f">later: u-blox M10 with LNA, dual-band</text><rect x="470" y="90" width="420" height="190" rx="10" fill="#ffffff" stroke="#b0bec5" stroke-width="1.5"/><text x="486" y="118" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#102027">SNS-5</text><text x="874" y="118" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#546e7a">1x5 2.54 mm header</text><rect x="486" y="134" width="58" height="36" rx="5" fill="#c62828"/><text x="515" y="148" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#ffffff">1</text><text x="515" y="163" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">3V3</text><rect x="550" y="134" width="58" height="36" rx="5" fill="#263238"/><text x="579" y="148" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#ffffff">2</text><text x="579" y="163" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">GND</text><rect x="614" y="134" width="58" height="36" rx="5" fill="#6a1b9a"/><text x="643" y="148" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#ffffff">3</text><text x="643" y="163" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">SDA</text><rect x="678" y="134" width="58" height="36" rx="5" fill="#6a1b9a"/><text x="707" y="148" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#ffffff">4</text><text x="707" y="163" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">SCL</text><rect x="742" y="134" width="58" height="36" rx="5" fill="#1565c0"/><text x="771" y="148" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#ffffff">5</text><text x="771" y="163" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">INT</text><text x="486" y="194" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#37474f">I²C sensor with one interrupt line.</text><text x="486" y="210" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#37474f">Fits: LIS3DH (tag) · LSM303AGR (handheld) · later: TMP117</text><text x="486" y="226" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#37474f">temperature, LIS2DW12, BME280</text><rect x="910" y="90" width="420" height="190" rx="10" fill="#ffffff" stroke="#b0bec5" stroke-width="1.5"/><text x="926" y="118" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#102027">DSP-4</text><text x="1314" y="118" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#546e7a">1x4 2.54 mm header</text><rect x="926" y="134" width="58" height="36" rx="5" fill="#263238"/><text x="955" y="148" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#ffffff">1</text><text x="955" y="163" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">GND</text><rect x="990" y="134" width="58" height="36" rx="5" fill="#c62828"/><text x="1019" y="148" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#ffffff">2</text><text x="1019" y="163" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">3V3</text><rect x="1054" y="134" width="58" height="36" rx="5" fill="#6a1b9a"/><text x="1083" y="148" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#ffffff">3</text><text x="1083" y="163" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">SCL</text><rect x="1118" y="134" width="58" height="36" rx="5" fill="#6a1b9a"/><text x="1147" y="148" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#ffffff">4</text><text x="1147" y="163" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">SDA</text><text x="926" y="194" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#37474f">I²C display, in the pin order most OLED modules use.</text><text x="926" y="210" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#37474f">Fits: 1.3&quot; SH1106 (default) · 0.96&quot; SSD1306 · later: other I²C OLEDs</text><rect x="30" y="300" width="420" height="190" rx="10" fill="#ffffff" stroke="#b0bec5" stroke-width="1.5"/><text x="46" y="328" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#102027">BAT-2</text><text x="434" y="328" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#546e7a">JST-PH 2-pin</text><rect x="46" y="344" width="58" height="36" rx="5" fill="#c62828"/><text x="75" y="358" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#ffffff">1</text><text x="75" y="373" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">VBAT</text><rect x="110" y="344" width="58" height="36" rx="5" fill="#263238"/><text x="139" y="358" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#ffffff">2</text><text x="139" y="373" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">GND</text><text x="46" y="404" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#37474f">Battery side of a charger module. The board never charges by</text><text x="46" y="420" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#37474f">itself.</text><text x="46" y="436" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#37474f">Fits: CN3791 solar MPPT + 18650 (tag) · TP4056 USB-C + LiPo</text><text x="46" y="452" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#37474f">(handheld) · IP5306 UPS (beacon) · later: bigger cells,</text><text x="46" y="468" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#37474f">BQ25570 harvester</text><rect x="470" y="300" width="420" height="190" rx="10" fill="#ffffff" stroke="#b0bec5" stroke-width="1.5"/><text x="486" y="328" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#102027">DBG-6</text><text x="874" y="328" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#546e7a">1x6 2.54 mm header</text><rect x="486" y="344" width="58" height="36" rx="5" fill="#c62828"/><text x="515" y="358" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#ffffff">1</text><text x="515" y="373" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">3V3</text><rect x="550" y="344" width="58" height="36" rx="5" fill="#263238"/><text x="579" y="358" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#ffffff">2</text><text x="579" y="373" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">GND</text><rect x="614" y="344" width="58" height="36" rx="5" fill="#1565c0"/><text x="643" y="358" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#ffffff">3</text><text x="643" y="373" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">RX2</text><rect x="678" y="344" width="58" height="36" rx="5" fill="#1565c0"/><text x="707" y="358" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#ffffff">4</text><text x="707" y="373" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">TX2</text><rect x="742" y="344" width="58" height="36" rx="5" fill="#1565c0"/><text x="771" y="358" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#ffffff">5</text><text x="771" y="373" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">BOOT0</text><rect x="806" y="344" width="58" height="36" rx="5" fill="#1565c0"/><text x="835" y="358" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#ffffff">6</text><text x="835" y="373" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">NRST</text><text x="486" y="404" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#37474f">Programming, ATC+ settings and log (RAK3172 UART2). RX2 goes</text><text x="486" y="420" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#37474f">to the adapter&#x27;s TXD.</text><text x="486" y="436" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#37474f">Fits: any 3.3 V USB-serial adapter (CP2102, CH340, FT232)</text><rect x="910" y="300" width="420" height="190" rx="10" fill="#ffffff" stroke="#b0bec5" stroke-width="1.5"/><text x="926" y="328" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#102027">OUT-2</text><text x="1314" y="328" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#546e7a">JST-PH 2-pin</text><rect x="926" y="344" width="58" height="36" rx="5" fill="#1565c0"/><text x="955" y="358" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#ffffff">1</text><text x="955" y="373" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">V+</text><rect x="990" y="344" width="58" height="36" rx="5" fill="#1565c0"/><text x="1019" y="358" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#ffffff">2</text><text x="1019" y="373" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">SW</text><text x="926" y="404" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#37474f">Low-side switched output (MOSFET + flyback diode on the</text><text x="926" y="420" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#37474f">board).</text><text x="926" y="436" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#37474f">Fits: magnetic buzzer · coin vibration motor · LED strip · later:</text><text x="926" y="452" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#37474f">louder piezo with booster</text></svg>
