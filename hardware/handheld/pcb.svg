ial, Helvetica, sans-serif" font-size="10.5" fill="#102027">RAK3172</text><rect x="754" y="164" width="137.16" height="22.86" fill="none" stroke="#f5f5f5" stroke-width="1.2"/><rect x="759.43" y="169.43" width="12" height="12" fill="#c9a227"/><circle cx="788.29" cy="175.43" r="6" fill="#c9a227"/><circle cx="811.15" cy="175.43" r="6" fill="#c9a227"/><circle cx="834.01" cy="175.43" r="6" fill="#c9a227"/><circle cx="856.87" cy="175.43" r="6" fill="#c9a227"/><circle cx="879.7299999999999" cy="175.43" r="6" fill="#c9a227"/><text x="754" y="159" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#f5f5f5">J2 GPS-6</text><rect x="754" y="506" width="114.3" height="22.86" fill="none" stroke="#f5f5f5" stroke-width="1.2"/><rect x="759.43" y="511.42999999999995" width="12" height="12" fill="#c9a227"/><circle cx="788.29" cy="517.43" r="6" fill="#c9a227"/><circle cx="811.15" cy="517.43" r="6" fill="#c9a227"/><circle cx="834.01" cy="517.43" r="6" fill="#c9a227"/><circle cx="856.87" cy="517.43" r="6" fill="#c9a227"/><text x="754" y="501" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#f5f5f5">J3 SNS-5</text><rect x="142" y="506" width="137.16" height="22.86" fill="none" stroke="#f5f5f5" stroke-width="1.2"/><rect x="147.43" y="511.42999999999995" width="12" height="12" fill="#c9a227"/><circle cx="176.29000000000002" cy="517.43" r="6" fill="#c9a227"/><circle cx="199.15" cy="517.43" r="6" fill="#c9a227"/><circle cx="222.01" cy="517.43" r="6" fill="#c9a227"/><circle cx="244.87" cy="517.43" r="6" fill="#c9a227"/><circle cx="267.73" cy="517.43" r="6" fill="#c9a227"/><text x="142" y="501" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#f5f5f5">J5 DBG-6</text><rect x="862" y="308" width="54" height="40.5" rx="1" fill="#eceff1" stroke="#f5f5f5"/><text x="889.0" y="361.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#f5f5f5">J1 BAT</text><rect x="862" y="407" width="72" height="36" fill="#212121" stroke="#f5f5f5"/><text x="898.0" y="403" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#f5f5f5">SW1</text><rect x="754" y="308" width="54" height="40.5" rx="1" fill="#eceff1" stroke="#f5f5f5"/><text x="781.0" y="361.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#f5f5f5">J6 VIB</text><rect x="754" y="380" width="54" height="40.5" rx="1" fill="#eceff1" stroke="#f5f5f5"/><text x="781.0" y="433.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#f5f5f5">J7 BUZ</text><rect x="160" y="182" width="27" height="27" fill="#212121" stroke="#f5f5f5"/><text x="173.5" y="178" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#f5f5f5">U2</text><rect x="214" y="182" width="27" height="27" fill="#212121" stroke="#f5f5f5"/><text x="227.5" y="178" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#f5f5f5">U3</text><text x="70" y="655" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1b2418">Layout notes</text><text x="70" y="677" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#37474f">• 2 layers, 1.6 mm. OLED sits on spacers above the board, buttons below it (thumb reach).</text><text x="70" y="696" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#37474f">• Compass breakout on J3 at least 20 mm from the vibration motor, buzzer and battery (magnetic parts).</text><text x="70" y="715" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#37474f">• GPS module at the top edge, antenna facing up when held. SMA bulkhead on the case top for the LoRa antenna.</text><text x="70" y="734" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#37474f">• Fits a 115×65×25 mm handheld case with a 103450 LiPo under the board.</text></svg>
