<svg xmlns="http://www.w3.org/2000/svg" width="1210" height="773" viewBox="0 0 1210 773"><rect width="100%" height="100%" fill="#fafbf7"/><defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,2 L10,5 L0,8 z" fill="#78909c"/></marker></defs><defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#5d1f1f" fill-opacity=".55"/><line x1="0" y1="0" x2="0" y2="8" stroke="#ef9a9a" stroke-width="2"/></pattern></defs><text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#1b2418">CTv1-HAND · reference PCB placement (top)</text><text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#546e7a">To scale, 100 × 55 mm, 2 layers. Placement and keep-outs only: route it in KiCad from netlist.csv.</text><line x1="70" y1="84" x2="970" y2="84" stroke="#78909c" stroke-width="1.2" marker-start="url(#a)" marker-end="url(#a)"/><text x="520.0" y="78.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#37474f">100 mm</text><line x1="40" y1="110" x2="40" y2="605" stroke="#78909c" stroke-width="1.2" marker-start="url(#a)" marker-end="url(#a)"/><text x="34.0" y="357.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#37474f" transform="rotate(-90 34.0 357.5)">55 mm</text><rect x="70" y="110" width="900" height="495" rx="18" fill="#1f5c3a" stroke="#0d3320" stroke-width="2"/><rect x="938.5" y="182" width="31.5" height="90" fill="url(#hatch)" stroke="#ef9a9a" stroke-dasharray="4 3"/><text x="978" y="196" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#c62828">GPS antenna:</text><text x="978" y="210" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#c62828">top edge,</text><text x="978" y="224" text-anchor="start" font-fa