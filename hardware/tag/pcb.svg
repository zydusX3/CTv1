<svg xmlns="http://www.w3.org/2000/svg" width="984" height="657" viewBox="0 0 984 657"><rect width="100%" height="100%" fill="#fafbf7"/><defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,2 L10,5 L0,8 z" fill="#78909c"/></marker></defs><defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#5d1f1f" fill-opacity=".55"/><line x1="0" y1="0" x2="0" y2="8" stroke="#ef9a9a" stroke-width="2"/></pattern></defs><text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#1b2418">CTv1-TAG · reference PCB placement (top)</text><text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#546e7a">To scale, 60 × 40 mm, 2 layers. Placement and keep-outs only: route it in KiCad from netlist.csv.</text><line x1="204.2" y1="84" x2="744.2" y2="84" stroke="#78909c" stroke-width="1.2" marker-start="url(#a)" marker-end="url(#a)"/><text x="474.20000000000005" y="78.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#37474f">60 mm</text><line x1="174.2" y1="110" x2="174.2" y2="470" stroke="#78909c" stroke-width="1.2" marker-start="url(#a)" marker-end="url(#a)"/><text x="168.2" y="290.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#37474f" transform="rotate(-90 168.2 290.0)">40 mm</text><rect x="204.2" y="110" width="540" height="360" rx="18" fill="#1f5c3a" stroke="#0d3320" stroke-width="2"/><rect x="204.2" y="191" width="31.5" height="234" fill="url(#hatch)" stroke="#ef9a9a" stroke-dasharray="4 3"/><text x="196.2" y="205" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#c62828">Antenna cable exit</text><text x="196.2" y="219" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#c62828">(IPEX on U1)</text><circle cx="235.7" cy="141.5" r="15.6" fill="#c9a227"/><circle cx="235.7" cy="141.5" r="14.4" fill="#ffffff" stroke="#0d3320"/><circle cx="712.7" cy="141.5" r="15.6" fill="#c9a227"/><circle cx="712.7" cy="141.5" r="14.4" fill="#ffffff" stroke="#0d3320"/><circle cx="235.7" cy="438.5" r="15.6" fill="#c9a227"/><circle cx="235.7" cy="438.5" r="14.4" fill="#ffffff" stroke="#0d3320"/><circle cx="712.7" cy="438.5" r="15.6" fill="#c9a227"/><circle cx="712.7" cy="438.5" r="14.4" fill="#ffffff" stroke="#0d3320"/><rect x="240.2" y="236" width="144" height="144" rx="3" fill="#b0bec5" stroke="#f5f5f5" stroke-width="1.5"/><text x="312.2" y="306.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#102027">U1</text><text x="312.2" y="321.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#102027">RAK3172</text><rect x="384.2" y="407" width="137.16" height="22.86" fill="none" stroke="#f5f5f5" stroke-width="1.2"/><rect x="389.63" y="412.43" width="12" height="12" fill="#c9a227"/><circle cx="418.49" cy="418.43" r="6" fill="#c9a227"/><circle cx="441.34999999999997" cy="418.43" r="6" fill="#c9a227"/><circle cx="464.21" cy="418.43" r="6" fill="#c9a227"/><circle cx="487.07" cy="418.43" r="6" fill="#c9a227"/><circle cx="509.93" cy="418.43" r="6" fill="#c9a227"/><text x="384.2" y="402" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#f5f5f5">J2 GPS-6</text><rect x="555.2" y="407" width="114.3" height="22.86" fill="none" stroke="#f5f5f5" stroke-width="1.2"/><rect x="560.63" y="412.43" width="12" height="12" fill="#c9a227"/><circle cx="589.49" cy="418.43" r="6" fill="#c9a227"/><circle cx="612.35" cy="418.43" r="6" fill="#c9a227"/><circle cx="635.21" cy="418.43" r="6" fill="#c9a227"/><circle cx="658.07" cy="418.43" r="6" fill="#c9a227"/><text x="555.2" y="402" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#f5f5f5">J3 SNS-5</text><rect x="438.2" y="146" width="137.16" height="22.86" fill="none" stroke="#f5f5f5" stroke-width="1.2"/><rect x="443.63" y="151.43" width="12" height="12" fill="#c9a227"/><circle cx="472.49" cy="157.43" r="6" fill="#c9a227"/><circle cx="495.34999999999997" cy="157.43" r="6" fill="#c9a227"/><circle cx="518.2099999999999" cy="157.43" r="6" fill="#c9a227"/><circle cx="541.0699999999999" cy="157.43" r="6" fill="#c9a227"/><circle cx="563.93" cy="157.43" r="6" fill="#c9a227"/><text x="438.2" y="141" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#f5f5f5">J4 DBG-6</text><rect x="654.2" y="164" width="54" height="40.5" rx="1" fill="#eceff1" stroke="#f5f5f5"/><text x="681.2" y="217.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#f5f5f5">J1 BAT-2</text><rect x="654.2" y="236" width="54" height="40.5" rx="1" fill="#eceff1" stroke="#f5f5f5"/><text x="681.2" y="289.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#f5f5f5">J5 OUT-2</text><rect x="456.2" y="218" width="27" height="27" fill="#212121" stroke="#f5f5f5"/><text x="469.7" y="214" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#f5f5f5">U2</text><rect x="501.2" y="218" width="27" height="27" fill="#212121" stroke="#f5f5f5"/><text x="514.7" y="214" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#f5f5f5">U3</text><circle cx="483.2" cy="299.0" r="27.0" fill="#263238" stroke="#f5f5f5"/><text x="483.2" y="303.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#f5f5f5">C2</text><rect x="600.2" y="254" width="27" height="27" fill="#212121" stroke="#f5f5f5"/><text x="613.7" y="250" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#f5f5f5">Q1</text><rect x="600.2" y="308" width="18" height="10.799999999999999" fill="#212121" stroke="#f5f5f5"/><text x="609.2" y="304" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#f5f5f5">D1</text><text x="204.2" y="520" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1b2418">Layout notes</text><text x="204.2" y="542" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#37474f">• 2 layers, 1.6 mm FR4, solid ground pour both sides, stitching vias every 5 mm.</text><text x="204.2" y="561" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#37474f">• Mount on TOP of the neck: GPS module (on J2) faces the sky, battery hangs below as counterweight.</text><text x="204.2" y="580" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#37474f">• Keep the GPS module and its patch antenna away from the RAK3172 RF cable.</text><text x="204.2" y="599" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#37474f">• C2 (220 µF) within 10 mm of U1 VDD; C7 at the pad.</text><text x="204.2" y="618" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#37474f">• Fits a 100×68×50 mm IP67 box with the 18650 and charger beside it. Conformal coat after test.</text></svg>
