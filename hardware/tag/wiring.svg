VIN<tspan fill="#90a4ae"> 3V3</tspan></text><circle cx="860" cy="376" r="5.5" fill="#212121" stroke="#ffffff" stroke-width="1.5"/><text x="874" y="380" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#263238">GND<tspan fill="#90a4ae"> GND</tspan></text><circle cx="860" cy="402" r="5.5" fill="#d81b60" stroke="#ffffff" stroke-width="1.5"/><text x="874" y="406" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#263238">SDA<tspan fill="#90a4ae"> SDA</tspan></text><circle cx="860" cy="428" r="5.5" fill="#6d4c41" stroke="#ffffff" stroke-width="1.5"/><text x="874" y="432" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#263238">SCL<tspan fill="#90a4ae"> SCL</tspan></text><circle cx="860" cy="454" r="5.5" fill="#1e88e5" stroke="#ffffff" stroke-width="1.5"/><text x="874" y="458" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#263238">INT1<tspan fill="#90a4ae"> ACC_INT</tspan></text><rect x="860" y="502" width="240" height="102" rx="8" fill="#ffffff" stroke="#455a64" stroke-width="1.6"/><text x="872" y="526" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700" fill="#102027">LED + 1 kΩ</text><circle cx="860" cy="554" r="5.5" fill="#3949ab" stroke="#ffffff" stroke-width="1.5"/><text x="874" y="558" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#263238">+<tspan fill="#90a4ae"> LED</tspan></text><circle cx="860" cy="580" r="5.5" fill="#212121" stroke="#ffffff" stroke-width="1.5"/><text x="874" y="584" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#263238">-<tspan fill="#90a4ae"> GND</tspan></text><rect x="860" y="628" width="240" height="128" rx="8" fill="#ffffff" stroke="#455a64" stroke-width="1.6"/><text x="872" y="652" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700" fill="#102027">Buzzer + 2N7002 + 1N4148</text><circle cx="860" cy="680" r="5.5" fill="#8e24aa" stroke="#ffffff" stroke-width="1.5"/><text x="874" y="684" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#263238">IN<tspan fill="#90a4ae"> BUZZ</tspan></text><circle cx="860" cy="706" r="5.5" fill="#e53935" stroke="#ffffff" stroke-width="1.5"/><text x="874" y="710" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#263238">3V3<tspan fill="#90a4ae"> 3V3</tspan></text><circle cx="860" cy="732" r="5.5" fill="#212121" stroke="#ffffff" stroke-width="1.5"/><text x="874" y="736" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#263238">GND<tspan fill="#90a4ae"> GND</tspan></text><text x="30" y="796" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1b2418">Notes</text><text x="30" y="818" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#37474f">• Power the RAK3172 from the battery/LDO board, not from the USB-serial adapter (TX at 20 dBm draws ~90 mA).</text><text x="30" y="837" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#37474f">• On the bench the GPS is powered all the time; PA8 (GPS_EN) can stay unconnected.</text><text x="30" y="856" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#37474f">• Connect only GND, TXD and RXD from the USB-serial adapter.</text></svg>
