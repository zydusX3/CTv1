<svg xmlns="http://www.w3.org/2000/svg" width="1330" height="908" viewBox="0 0 1330 908"><rect width="100%" height="100%" fill="#fafbf7"/><defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,2 L10,5 L0,8 z" fill="#78909c"/></marker></defs><defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#5d1f1f" fill-opacity=".55"/><line x1="0" y1="0" x2="0" y2="8" stroke="#ef9a9a" stroke-width="2"/></pattern></defs><text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#1b2418">CTv1-BEACON · reference PCB placement (top)</text><text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#546e7a">To scale, 100 × 70 mm, 2 layers. Placement and keep-outs only: route it in KiCad from netlist.csv.</text><line x1="190.39999999999998" y1="84" x2="1090.4" y2="84" stroke="#78909c" stroke-width="1.2" marker-start="url(#a)" marker-end="url(#a)"/><text x="640.4000000000001" y="78.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#37474f">100 mm</text><line x1="160.39999999999998" y1="110" x2="160.39999999999998" y2="740" stroke="#78909c" stroke-width="1.2" marker-start="url(#a)" marker-end="url(#a)"/><text x="154.39999999999998" y="425.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#37474f" transform="rotate(-90 154.39999999999998 425.0)">70 mm</text><rect x="190.39999999999998" y="110" width="900" height="630" rx="18" fill="#1f5c3a" stroke="#0d3320" stroke-width="2"/><rect x="190.39999999999998" y="326" width="36" height="108" fill="url(#hatch)" stroke="#ef9a9a" stroke-dasharray="4 3"/><text x="182.39999999999998" y="340" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#c62828">u.FL pigtail →</text><text x="182.39999999999998" y="354" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#c62828">N-type bulkhead,</text><text x="182.39999999999998" y="368" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#c62828">roof antenna</text><circle cx="226.39999999999998" cy="146" r="15.6" fill="#c9a227"/><circle cx="226.39999999999998" cy="146" r="14.4" fill="#ffffff" stroke="#0d3320"/><circle cx="1054.4" cy="146" r="15.6" fill="#c9a227"/><circle cx="1054.4" cy="146" r="14.4" fill="#ffffff" stroke="#0d3320"/><circle cx="226.39999999999998" cy="704" r="15.6" fill="#c9a227"/><circle cx="226.39999999999998" cy="704" r="14.4" fill="#ffffff" stroke="#0d3320"/><circle cx="1054.4" cy="704" r="15.6" fill="#c9a227"/><circle cx="1054.4" cy="704" r="14.4" fill="#ffffff" stroke="#0d3320"/><rect x="460.4" y="272" width="567" height="252" rx="3" fill="#b0bec5" stroke="#f5f5f5" stroke-width="1.5"/><text x="743.9" y="396.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#102027">M1</text><text x="743.9" y="411.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#102027">ESP32-S3-DevKitC-1 (2x22 sockets)</text><rect x="262.4" y="308" width="144" height="144" rx="3" fill="#b0bec5" stroke="#f5f5f5" stroke-width="1.5"/><text x="334.4" y="378.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#102027">U1</text><text x="334.4" y="393.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#102027">RAK3172</text><rect x="262.4" y="560" width="360" height="126" rx="3" fill="none" stroke="#f5f5f5" stroke-width="1.5" stroke-dasharray="6 4"/><text x="442.4" y="627.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#f5f5f5">M2 · IP5306 UPS + 18650 (off-board)</text><rect x="658.4" y="632" width="63" height="45" rx="1" fill="#eceff1" stroke="#f5f5f5"/><text x="689.9" y="690" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#f5f5f5">J1 5V IN</text><rect x="766.4" y="632" width="63" height="45" rx="1" fill="#eceff1" stroke="#f5f5f5"/><text x="797.9" y="690" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#f5f5f5">J4 12V</text><rect x="874.4" y="632" width="63" height="45" rx="1" fill="#eceff1" stroke="#f5f5f5"/><text x="905.9" y="690" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#f5f5f5">J3 SIREN</text><rect x="262.4" y="182" width="137.16" height="22.86" fill="none" stroke="#f5f5f5" stroke-width="1.2"/><rect x="267.83" y="187.43" width="12" height="12" fill="#c9a227"/><circle cx="296.69" cy="193.43" r="6" fill="#c9a227"/><circle cx="319.55" cy="193.43" r="6" fill="#c9a227"/><circle cx="342.40999999999997" cy="193.43" r="6" fill="#c9a227"/><circle cx="365.27" cy="193.43" r="6" fill="#c9a227"/><circle cx="388.13" cy="193.43" r="6" fill="#c9a227"/><text x="262.4" y="177" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#f5f5f5">J6 DBG-6</text><rect x="460.4" y="182" width="91.44" height="22.86" fill="none" stroke="#f5f5f5" stroke-width="1.2"/><rect x="465.83" y="187.43" width="12" height="12" fill="#c9a227"/><circle cx="494.69" cy="193.43" r="6" fill="#c9a227"/><circle cx="517.55" cy="193.43" r="6" fill="#c9a227"/><circle cx="540.41" cy="193.43" r="6" fill="#c9a227"/><text x="460.4" y="177" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#f5f5f5">J5 DSP-4</text><circle cx="995.9" cy="591.5" r="15.5" fill="#ffcc80" stroke="#f5f5f5"/><text x="1015.4" y="595.5" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#f5f5f5">D1 RX</text><circle cx="995.9" cy="645.5" r="15.5" fill="#ffcc80" stroke="#f5f5f5"/><text x="1015.4" y="649.5" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#f5f5f5">D2 ALM</text><rect x="874.4" y="569" width="27" height="27" fill="#212121" stroke="#f5f5f5"/><text x="887.9" y="565" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#f5f5f5">Q1</text><text x="190.39999999999998" y="790" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1b2418">Layout notes</text><text x="190.39999999999998" y="812" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#37474f">• 2 layers, 1.6 mm. The DevKitC plugs in, so it can be replaced or upgraded (e.g. ESP32-S3 with Ethernet).</text><text x="190.39999999999998" y="831" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#37474f">• Mount the box under the roof near the antenna; keep the coax (LMR-240) under 5 m, with the lightning arrester grounded.</text><text x="190.39999999999998" y="850" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#37474f">• Keep the DevKitC&#x27;s WiFi antenna end clear of the ground pour and metal (board edge).</text><text x="190.39999999999998" y="869" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#37474f">• Siren traces (J3/J4/Q1) 1 mm wide; screw terminals at the board edge.</text></svg>
