<title>CTv1 Herd Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen farm app. Map fills the left, a tabbed panel (herd / alerts / fences / devices) on the right; stacks map-over-panel on phones. */
:root {
  --bg: #f4f6ef;
  --surface: #ffffff;
  --sunk: #eaeee2;
  --fg: #1b2418;
  --muted: #5d6a58;
  --line: #d6dccb;
  --tag: #f2c200;          /* ear-tag yellow: tags + fence wire */
  --tag-ink: #1b2418;
  --fence: #a88600;
  --accent: #2f6b3a;       /* pasture green for actions */
  --accent-ink: #ffffff;
  --ok: #2e8540;
  --warn: #b86e00;
  --crit: #c8322b;
  --crit-ink: #ffffff;
  --ok-soft: #e1f0e2;
  --warn-soft: #fbeed6;
  --crit-soft: #fbe2df;
  --ground: #e3e9d4;
  --paddock: #cfdfb6;
  --crop: #eadfae;
  --crop-row: #d6c788;
  --water: #9cc3d6;
  --track: #cbc2a9;
  --tree: #98b47f;
  --house: #8a7f6c;
  --map-ink: #3d4a37;

  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11150f; --surface: #192017; --sunk: #141a12; --fg: #e5eadf; --muted: #9aa693; --line: #2c3529;
    --tag: #f2c200; --tag-ink: #1b2418; --fence: #f2c200; --accent: #7fc28a; --accent-ink: #10180f;
    --ok: #6cc47a; --warn: #f0a640; --crit: #ff6b5e; --crit-ink: #1a0d0b;
    --ok-soft: #1d3220; --warn-soft: #3a2a12; --crit-soft: #3d1a17;
    --ground: #1a2318; --paddock: #22301e; --crop: #352f1c; --crop-row: #4a4126; --water: #2b4a59;
    --track: #3a382d; --tree: #2f4529; --house: #6f6656; --map-ink: #b5c0ad;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11150f; --surface: #192017; --sunk: #141a12; --fg: #e5eadf; --muted: #9aa693; --line: #2c3529;
  --tag: #f2c200; --tag-ink: #1b2418; --fence: #f2c200; --accent: #7fc28a; --accent-ink: #10180f;
  --ok: #6cc47a; --warn: #f0a640; --crit: #ff6b5e; --crit-ink: #1a0d0b;
  --ok-soft: #1d3220; --warn-soft: #3a2a12; --crit-soft: #3d1a17;
  --ground: #1a2318; --paddock: #22301e; --crop: #352f1c; --crop-row: #4a4126; --water: #2b4a59;
  --track: #3a382d; --tree: #2f4529; --house: #6f6656; --map-ink: #b5c0ad;
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--f-body); font-size: 14px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  box-sizing: border-box;
}
*, *::before, *::after { box-sizing: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 12px; }

/* ---------- top bar ---------- */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand svg { width: 30px; height: 34px; flex: none; }
.brand h1 { font-family: var(--f-display); font-weight: 700; font-size: 26px; letter-spacing: .01em; line-height: 1; margin: 0; }
.brand small { display: block; font-size: 12px; color: var(--muted); font-family: var(--f-body); font-weight: 400; letter-spacing: 0; margin-top: 2px; }
.stats { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
.pill {
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px;
  background: var(--sunk); border: 1px solid var(--line); font-size: 12.5px; white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.ok { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
.pill.ok { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
.pill.warn { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
.pill.crit { background: var(--crit-soft); border-color: transparent; color: var(--crit); font-weight: 600; }
.clock { font-family: var(--f-mono); font-size: 12.5px; }

/* ---------- main split ---------- */
.shell { display: grid; grid-template-columns: minmax(0, 1fr) 390px; gap: 12px; min-height: 0; }

.mapwrap {
  position: relative; min-height: 0; border-radius: 10px; overflow: hidden;
  background: var(--ground); border: 1px solid var(--line);
}
#map { display: block; width: 100%; height: 100%; touch-action: none; user-select: none; }
.map-tools {
  position: absolute; top: 10px; right: 10px; display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end;
  max-width: calc(100% - 20px);
}
.tool {
  border: 1px solid var(--line); background: var(--surface); padding: 6px 11px; border-radius: 7px;
  font-size: 12.5px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
}
.tool:hover { border-color: var(--muted); }
.tool[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.tool.danger { color: var(--crit); }
.map-note {
  position: absolute; left: 10px; top: 10px; background: var(--surface); border: 1px solid var(--line);
  border-radius: 7px; padding: 6px 10px; font-size: 12px; color: var(--muted); max-width: 250px;
}
.map-note b { color: var(--fg); font-weight: 600; }
.legend { position: absolute; left: 10px; bottom: 10px; display: flex; flex-wrap: wrap; gap: 4px 12px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 6px 10px; font-size: 11.5px; color: var(--muted); max-width: calc(100% - 120px); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.sw { width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid var(--tag-ink); background: var(--tag); flex: none; }
.sw.out { background: var(--crit); border-color: var(--crit); }
.sw.stale { background: transparent; border: 1.5px dashed var(--muted); }
.sw.line { width: 16px; height: 0; border-radius: 0; border: 0; border-top: 2.5px dashed var(--fence); background: none; }
.sw.zone { border-radius: 2px; background: var(--crit-soft); border: 1.5px solid var(--crit); }

/* SVG map styling (all via tokens) */
.m-ground { fill: var(--ground); }
.m-water { fill: none; stroke: var(--water); stroke-width: 14; stroke-linecap: round; }
.m-track { fill: none; stroke: var(--track); stroke-width: 7; stroke-linecap: round; }
.m-tree { fill: var(--tree); }
.m-house { fill: var(--house); }
.m-label { fill: var(--map-ink); font-family: var(--f-display); font-size: 17px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; opacity: .75; }
.m-small { fill: var(--map-ink); font-family: var(--f-body); font-size: 12px; }
.m-mono { fill: var(--map-ink); font-family: var(--f-mono); font-size: 11px; }
.f-keep { fill: var(--paddock); stroke: var(--fence); stroke-width: 3; stroke-dasharray: 10 6; }
.f-out { fill: url(#cropRows); stroke: var(--crit); stroke-width: 2.5; }
.f-handle { fill: var(--surface); stroke: var(--fence); stroke-width: 3; cursor: grab; }
.f-handle:hover { fill: var(--tag); }
.trail { fill: none; stroke: var(--fg); stroke-opacity: .35; stroke-width: 2; stroke-dasharray: 2 5; stroke-linecap: round; }
.trail.sel { stroke: var(--accent); stroke-opacity: .9; stroke-width: 3; stroke-dasharray: none; }
.trail-pt { fill: var(--accent); }
.route { fill: none; stroke: var(--accent); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; opacity: .9; }
.route.out { stroke: var(--crit); }
.route-start { fill: var(--surface); stroke: var(--accent); stroke-width: 3; }
.route-tick { fill: var(--accent); }
.route-time { fill: var(--map-ink); font-family: var(--f-mono); font-weight: 500; paint-order: stroke; stroke: var(--ground); stroke-linejoin: round; }

/* Simple view: route card for the tapped cow */
.route-card {
  position: absolute; left: 10px; bottom: 10px; right: 96px; max-width: 420px;
  background: var(--surface); border: 2px solid var(--fg); border-radius: 14px; padding: 12px 14px;
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center;
  box-shadow: 0 2px 10px rgba(0,0,0,.18);
  left: calc(10px + env(safe-area-inset-left, 0px)); bottom: calc(10px + env(safe-area-inset-bottom, 0px));
}
.route-card h2 { margin: 0; font-family: var(--f-display); font-size: 26px; line-height: 1.05; }
.route-card p { margin: 0; font-size: 16px; }
.route-card .big { font-size: 19px; font-weight: 600; }
.route-card button {
  grid-row: 1 / span 3; grid-column: 2; font-size: 17px; font-weight: 600; padding: 12px 14px; border-radius: 12px;
  border: 2px solid var(--fg); background: var(--surface); cursor: pointer;
}
@media (max-width: 480px) { .route-card { right: 88px; padding: 10px 12px; grid-template-columns: minmax(0, 1fr); } .route-card h2 { font-size: 22px; } .route-card p { font-size: 15px; } .route-card .big { font-size: 17px; } .route-card button { grid-row: auto; grid-column: 1 / -1; padding: 9px; } }
.cow { cursor: pointer; transition: transform .9s ease; }
@media (prefers-reduced-motion: reduce) { .cow { transition: none; } .pulse { animation: none !important; } }
.cow .body { fill: var(--tag); stroke: var(--tag-ink); stroke-width: 2.5; }
.cow text { fill: var(--tag-ink); font-family: var(--f-display); font-weight: 700; font-size: 14px; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.cow .name { fill: var(--map-ink); font-family: var(--f-body); font-weight: 600; font-size: 11.5px; }
.cow.out .body { fill: var(--crit); stroke: var(--crit); }
.cow.out text.num { fill: var(--crit-ink); }
.cow.stale .body { fill: var(--surface); stroke: var(--muted); stroke-dasharray: 4 3; }
.cow.stale text.num { fill: var(--muted); }
.cow .ring { fill: none; stroke: var(--accent); stroke-width: 3; opacity: 0; }
.cow.sel .ring { opacity: 1; }
.pulse { fill: none; stroke: var(--crit); stroke-width: 3; animation: pulse 1.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
.pulse.buzz { stroke: var(--tag); }
@keyframes pulse { from { transform: scale(1); opacity: .9; } to { transform: scale(2.6); opacity: 0; } }
.hh-body { fill: var(--accent); stroke: var(--surface); stroke-width: 2.5; }
.gw-ring { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 3 5; opacity: .55; }
.link { stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 6 5; opacity: .8; }

/* ---------- side panel ---------- */
.panel {
  min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr);
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
}
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--line); }
.tab {
  background: none; border: 0; border-bottom: 2.5px solid transparent; padding: 11px 4px 9px; cursor: pointer;
  font-family: var(--f-display); font-weight: 600; font-size: 15px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted);
  display: inline-flex; justify-content: center; align-items: center; gap: 6px;
}
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--fence); }
.badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--crit); color: var(--crit-ink);
  font-family: var(--f-body); font-size: 11px; font-weight: 600; letter-spacing: 0; display: inline-grid; place-items: center; }
.pane { overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.eyebrow { font-family: var(--f-display); font-weight: 600; font-size: 13px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin: 0; }
.sec { display: flex; flex-direction: column; gap: 8px; min-width: 0; }

.tagchip {
  flex: none; width: 34px; height: 30px; display: grid; place-items: center; background: var(--tag); color: var(--tag-ink);
  font-family: var(--f-display); font-weight: 700; font-size: 16px; border-radius: 9px 9px 9px 9px / 12px 12px 7px 7px;
  border: 2px solid var(--tag-ink); position: relative;
}
.tagchip::before { content: ""; position: absolute; top: 3px; left: 50%; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--surface); border: 1px solid var(--tag-ink); }
.tagchip span { margin-top: 5px; }

/* selected card */
.card { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 10px; background: var(--bg); }
.card-head { display: flex; align-items: center; gap: 10px; }
.card-head h2 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 24px; line-height: 1; }
.card-head p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
.card-head .pill { margin-left: auto; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; margin: 0; }
.facts div { min-width: 0; }
.facts dt { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.facts dd { margin: 1px 0 0; font-family: var(--f-mono); font-size: 12.5px; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: 7px; cursor: pointer; font-size: 13px; font-weight: 500; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.btn:disabled { opacity: .55; cursor: default; }
.hint { font-size: 12px; color: var(--muted); margin: 0; }

/* herd list */
.list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.row {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px;
  padding: 9px 10px; background: var(--surface); border: 0; border-bottom: 1px solid var(--line); text-align: left; cursor: pointer; width: 100%;
}
.row:last-child { border-bottom: 0; }
.row:hover { background: var(--sunk); }
.row[aria-current="true"] { background: var(--sunk); box-shadow: inset 3px 0 0 var(--accent); }
.row strong { display: block; font-weight: 600; }
.row small { display: block; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.row-end { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.batt { display: inline-flex; align-items: center; gap: 5px; font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.batt i { width: 26px; height: 9px; border: 1.5px solid var(--muted); border-radius: 2px; position: relative; display: block; }
.batt i::after { content: ""; position: absolute; inset: 1px auto 1px 1px; width: calc(var(--p) * 1% - 2px); background: var(--ok); border-radius: 1px; }
.batt.low i::after { background: var(--crit); }
.batt.low { color: var(--crit); }

/* alerts */
.alert { display: grid; grid-template-columns: 4px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 10px 10px 10px 0; border-bottom: 1px solid var(--line); }
.alert:last-child { border-bottom: 0; }
.alert .stripe { align-self: stretch; border-radius: 0 3px 3px 0; background: var(--muted); }
.alert.crit .stripe { background: var(--crit); }
.alert.warn .stripe { background: var(--warn); }
.alert.info .stripe { background: var(--ok); }
.alert p { margin: 0; }
.alert .msg { font-weight: 600; }
.alert .meta { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.alert.acked .msg { font-weight: 400; color: var(--muted); }

/* rules / switches */
.rule { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
.rule:last-child { border-bottom: 0; }
.rule label { font-weight: 500; cursor: pointer; }
.rule small { display: block; color: var(--muted); font-size: 12px; font-weight: 400; }
.switch { appearance: none; width: 38px; height: 22px; border-radius: 11px; background: var(--line); position: relative; cursor: pointer; margin: 0; transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); transition: left .15s; }
.switch:checked { background: var(--accent); }
.switch:checked::after { left: 19px; }

/* fences + devices */
.fence { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px; border: 1px solid var(--line); border-radius: 10px; }
.fence .ico { width: 30px; height: 30px; border-radius: 6px; background: var(--paddock); border: 2.5px dashed var(--fence); }
.fence .ico.out { background: var(--crop); border: 2.5px solid var(--crit); }
.fence strong { display: block; }
.fence small { display: block; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; margin: 0; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; text-align: right; font-family: var(--f-mono); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; font-variant-numeric: tabular-nums; }
th, td { padding: 7px 9px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-weight: 600; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; background: var(--sunk); }
tr:last-child td { border-bottom: 0; }
td.mono { font-family: var(--f-mono); }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 13.5px;
  max-width: min(460px, calc(100% - 32px)); box-shadow: 0 6px 24px rgba(0,0,0,.25); z-index: 20;
}

/* ---------- zoom + mode switch ---------- */
.zoom { position: absolute; right: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 6px; }
.zbtn {
  width: 38px; height: 38px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface);
  font-size: 20px; font-weight: 600; line-height: 1; cursor: pointer; display: grid; place-items: center; padding: 0;
}
.zbtn.wide { width: auto; padding: 0 10px; font-size: 12.5px; font-weight: 500; }
.zbtn:hover { border-color: var(--muted); }
.mode-btn {
  border: 1px solid var(--line); background: var(--surface); padding: 5px 12px; border-radius: 999px;
  font-size: 12.5px; font-weight: 600; cursor: pointer; white-space: nowrap;
}
.mode-btn:hover { border-color: var(--muted); }
.cow .name, .home-label { paint-order: stroke; stroke: var(--ground); stroke-width: 4px; stroke-linejoin: round; }
.home-label { fill: var(--map-ink); font-family: var(--f-body); font-weight: 600; font-size: 12px; }

/* Simple view: map only, big targets, big type */
:root[data-mode="simple"] .stats,
:root[data-mode="simple"] .panel,
:root[data-mode="simple"] .map-tools,
:root[data-mode="simple"] .legend,
:root[data-mode="simple"] .map-note,
:root[data-mode="simple"] .adv-only { display: none; }
:root:not([data-mode="simple"]) .simple-only { display: none; }
:root[data-mode="simple"] .shell { grid-template-columns: 1fr; }
:root[data-mode="simple"] .brand h1 { font-size: 34px; }
:root[data-mode="simple"] .brand small { font-size: 15px; }
:root[data-mode="simple"] .brand svg { width: 38px; height: 43px; }
:root[data-mode="simple"] .top { flex-wrap: nowrap; justify-content: space-between; }
:root[data-mode="simple"] .mode-btn {
  margin-left: auto; font-size: 17px; padding: 12px 18px; border-radius: 12px; border-width: 2px; border-color: var(--fg);
}
:root[data-mode="simple"] .zoom { right: calc(14px + env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); gap: 10px; }
:root[data-mode="simple"] .zbtn {
  width: 64px; height: 64px; border-radius: 14px; font-size: 34px; border: 2px solid var(--fg);
  box-shadow: 0 2px 10px rgba(0,0,0,.18);
}
:root[data-mode="simple"] .zbtn.wide { width: 64px; padding: 0; font-size: 14px; line-height: 1.1; }
:root[data-mode="simple"] .cow .name { font-weight: 700; }
:root[data-mode="simple"] .toast {

  left: max(16px, env(safe-area-inset-left, 0px)); right: calc(100px + env(safe-area-inset-right, 0px));
}

/* Simple view status line: one sentence, colour + icon + words */
.status-line {
  display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; cursor: pointer;
  padding: 14px 18px; border-radius: 12px; border: 2px solid transparent;
  font-size: 21px; font-weight: 600; line-height: 1.25;
}
.status-line .ico { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 21px; font-weight: 700; }
.status-line small { display: block; font-size: 15px; font-weight: 400; margin-top: 2px; }
.status-line.ok { background: var(--ok-soft); color: var(--fg); border-color: var(--ok); }
.status-line.ok .ico { background: var(--ok); color: var(--surface); }

.status-line.crit .ico { background: var(--crit-ink); color: var(--crit); }
@media (max-width: 480px) { .status-line { font-size: 18px; padding: 12px 14px; } .status-line small { font-size: 14px; } }

@media (max-width: 880px) {

  .stats { margin-left: 0; }
}

  .legend { display: none; }

}

<div class="toast" id="toast" hidden></div>

<script>
(() => {
  // ---------- world (1 SVG unit = 1 metre) ----------
  const START = 6 * 60 + 40, MIN_PER_TICK = 2, NORMAL = 10, FAST = 2, STALE_AFTER = 30;
  const ORIGIN = { lat: 10.85, lon: 76.27 };        // sample coordinates for display only
  const HOUSE = { x: 150, y: 538 };
  const HANDHELD = { x: 560, y: 600 };
  const CROP_CENTRE = { x: 895, y: 300 };

  let tick = 0, paused = false, editMode = false, allTrails = false, tab = 'herd', selected = '02';
  let breakoutDone = false, packetsHour = 0, drag = null, toastTimer = null;
  const now = () => START + tick * MIN_PER_TICK;

  const fences = [
    { id: 'main', name: 'Main paddock', kind: 'keep_in', pts: [[230,170],[720,150],[800,330],[760,520],[300,540],[200,380]] },
    { id: 'crop', name: 'Maize plot', kind: 'keep_out', pts: [[830,190],[960,190],[960,430],[830,430]] },
  ];

  const rules = [
    { id: 'r-exit', name: 'Leaves paddock fence', desc: '2 fixes in a row outside, or 1 fix more than 25 m out', on: true },
    { id: 'r-zone', name: 'Enters keep-out zone', desc: 'Same check, for crops and roads', on: true },
    { id: 'r-stale', name: 'No update from a tag', desc: 'More than 30 min (3 missed reports)', on: true },
    { id: 'r-batt', name: 'Battery low', desc: 'Below 20 % (about 3.5 V)', on: true },
    { id: 'r-still', name: 'No movement', desc: 'Activity near zero for 4 h in daytime', on: true },
    { id: 'r-night', name: 'Night movement', desc: 'Herd moves over 200 m, 22:00–05:00', on: false },
  ];

  const rnd = (a, b) => a + Math.random() * (b - a);
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  const fmt = m => { m = ((Math.round(m) % 1440) + 1440) % 1440; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };
  const ago = m => { const d = Math.round(now() - m); return d <= 0 ? 'just now' : d < 60 ? d + ' min ago' : Math.floor(d / 60) + ' h ' + (d % 60) + ' min ago'; };
  const toLatLon = p => {
    const lat = ORIGIN.lat + (350 - p.y) / 111320;
    const lon = ORIGIN.lon + (p.x - 500) / (111320 * Math.cos(ORIGIN.lat * Math.PI / 180));
    return lat.toFixed(5) + '° N, ' + lon.toFixed(5) + '° E';
  };
  const compass = (from, to) => {
    const deg = (Math.atan2(to.x - from.x, from.y - to.y) * 180 / Math.PI + 360) % 360;
    return ['N','NE','E','SE','S','SW','W','NW'][Math.round(deg / 45) % 8];
  };
  const volts = p => (3.3 + 0.9 * p / 100).toFixed(2);

  function inPoly(x, y, pts) {
    let inside = false;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      const [xi, yi] = pts[i], [xj, yj] = pts[j];
      if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
    }
    return inside;
  }
  function edgeDist(x, y, pts) {
    let best = Infinity;
    for (let i = 0; i < pts.length; i++) {
      const [ax, ay] = pts[i], [bx, by] = pts[(i + 1) % pts.length];
      const dx = bx - ax, dy = by - ay, t = Math.max(0, Math.min(1, ((x - ax) * dx + (y - ay) * dy) / (dx * dx + dy * dy)));
      best = Math.min(best, Math.hypot(x - (ax + t * dx), y - (ay + t * dy)));
    }
    return best;
  }
  const area = pts => Math.abs(pts.reduce((s, [x, y], i) => { const [x2, y2] = pts[(i + 1) % pts.length]; return s + x * y2 - x2 * y; }, 0)) / 2;
  const perimeter = pts => pts.reduce((s, [x, y], i) => { const [x2, y2] = pts[(i + 1) % pts.length]; return s + Math.hypot(x2 - x, y2 - y); }, 0);
  const centroid = pts => ({ x: pts.reduce((s, p) => s + p[0], 0) / pts.length, y: pts.reduce((s, p) => s + p[1], 0) / pts.length });
  const fence = id => fences.find(f => f.id === id);

  // ---------- herd ----------
  const herd = [
    ['01','Daisy',420,300,92], ['02','Moti',600,330,74], ['03','Bella',470,380,88], ['04','Gauri',520,280,66],
    ['05','Rosie',380,420,95], ['06','Kali',560,430,81], ['07','Bruno',450,240,58], ['08','Lily',650,470,14],
  ].map(([tag, name, x, y, batt], i) => ({
    tag, name, x, y, batt, trail: [], mode: 'graze', heading: rnd(0, 6.28),
    last: START - (i % 5) * 2 - 1, nextAt: START + (i % 5) * 2 + 1, fast: false, manualFast: 0,
    state: { main: { inside: true, cnt: 0 }, crop: { inside: false, cnt: 0 } },
    buzzQ: false, buzzing: 0, rssi: -95, snr: 7, sats: 9, hdop: 1.1, activity: 40, stale: false,
  }));
  const lily = herd[7];
  lily.last = START - 34; lily.nextAt = Infinity; lily.stale = true; lily.sats = 0;

  const alerts = [];
  let alertSeq = 0;
  function raise(sev, msg, tag, at = now(), acked = false) {
    alerts.unshift({ id: ++alertSeq, sev, msg, tag, at, acked, ackAt: acked ? at + 4 : null });
    if (sev === 'crit' && !acked) {
      toast(msg);
      if (simple()) showAll();   // simple view: make sure the animal in trouble is on screen
    }
  }
  raise('info', 'Home beacon back on mains power after a 6 min power cut', null, START - 290, true);
  raise('warn', 'Bruno (#07) battery below 60 %, solar charging resumed', '07', START - 95, true);
  raise('warn', 'Lily (#08) has not reported for 30 min. Last fix near the trees, south-east of the trough.', '08', START - 4);

  const routeMetres = c => c.trail.reduce((s, p, i) => i ? s + Math.hypot(p[0] - c.trail[i - 1][0], p[1] - c.trail[i - 1][1]) : 0, 0);
  const fmtKm = m => m < 1000 ? Math.round(m / 10) * 10 + ' m' : (m / 1000).toFixed(1) + ' km';
  let routeTag = null;   // simple view: whose full route is shown

  function herdCentre(except) {
    const g = herd.filter(c => c !== except && c.mode === 'graze' && !c.stale);
    return { x: g.reduce((s, c) => s + c.x, 0) / g.length, y: g.reduce((s, c) => s + c.y, 0) / g.length };
  }

  function move(c) {
    const main = fence('main').pts;
    if (c.mode === 'escape' || c.mode === 'return') {
      const target = c.mode === 'escape' ? CROP_CENTRE : centroid(main);
      const d = dist(c, target), step = Math.min(d, rnd(45, 65));
      if (d < 25) { c.mode = c.mode === 'escape' ? 'raid' : 'graze'; }
      c.x += (target.x - c.x) / (d || 1) * step + rnd(-6, 6);
      c.y += (target.y - c.y) / (d || 1) * step + rnd(-6, 6);
      c.activity = Math.round(rnd(140, 220));
      return;
    }
    if (c.mode === 'raid') {
      const crop = fence('crop').pts;
      for (let k = 0; k < 8; k++) {
        const nx = c.x + rnd(-25, 25), ny = c.y + rnd(-25, 25);
        if (inPoly(nx, ny, crop)) { c.x = nx; c.y = ny; break; }
      }
      c.activity = Math.round(rnd(60, 120));
      return;
    }
    const centre = herdCentre(c);
    const inside = inPoly(c.x, c.y, main);
    if (!inside) {   // fence was edited around it: walk back in
      const t = centroid(main), d = dist(c, t) || 1;
      c.x += (t.x - c.x) / d * 40; c.y += (t.y - c.y) / d * 40;
      return;
    }
    for (let k = 0; k < 10; k++) {
      const h = c.heading + rnd(-0.9, 0.9), step = rnd(10, 32);
      const nx = c.x + Math.cos(h) * step + (centre.x - c.x) * 0.06;
      const ny = c.y + Math.sin(h) * step + (centre.y - c.y) * 0.06;
      if (inPoly(nx, ny, main) && edgeDist(nx, ny, main) > 18) { c.x = nx; c.y = ny; c.heading = h; c.activity = Math.round(step * 3 + rnd(0, 20)); return; }
      c.heading += Math.PI / 2;
    }
  }

  function checkFences(c) {
    for (const f of fences) {
      const st = c.state[f.id];
      const inside = inPoly(c.x, c.y, f.pts);
      if (inside === st.inside) { st.cnt = 0; continue; }
      st.cnt++;
      const far = edgeDist(c.x, c.y, f.pts) > 25;
      const bad = f.kind === 'keep_in' ? !inside : inside;
      if (st.cnt >= 2 || (bad && far)) {
        st.inside = inside; st.cnt = 0;
        const rule = f.kind === 'keep_in' ? 'r-exit' : 'r-zone';
        if (!rules.find(r => r.id === rule).on) continue;
        if (bad) raise('crit', `${c.name} (#${c.tag}) ${f.kind === 'keep_in' ? 'left ' + f.name : 'entered ' + f.name + ' (keep-out)'}`, c.tag);
        else raise('info', `${c.name} (#${c.tag}) ${f.kind === 'keep_in' ? 'is back inside ' + f.name : 'left ' + f.name}`, c.tag);
      }
    }
    c.fast = isOutside(c);
  }
  const isOutside = c => !c.state.main.inside || c.state.crop.inside || !inPoly(c.x, c.y, fence('main').pts) || inPoly(c.x, c.y, fence('crop').pts);

  function report(c, quiet) {
    move(c);
    c.trail.push([c.x, c.y, now()]); if (c.trail.length > 720) c.trail.shift();   // a full day at 2-min reports
    if (quiet) return;
    c.last = now(); c.stale = false;
    const d = Math.max(30, dist(c, HOUSE));
    c.rssi = Math.round(-42 - 20 * Math.log10(d) + rnd(-3, 3));
    c.snr = +(Math.max(-6, 11 - d / 110 + rnd(-1.5, 1.5))).toFixed(1);
    c.sats = Math.round(rnd(7, 12)); c.hdop = +rnd(0.8, 1.6).toFixed(1);
    c.batt = Math.max(0, +(c.batt - 0.03).toFixed(2));
    packetsHour++;
    checkFences(c);
    if (c.buzzQ) { c.buzzQ = false; c.buzzing = 4; toast(`${c.name} (#${c.tag}) got the command and is buzzing for 30 s`); }
    const interval = c.fast || c.manualFast > now() ? FAST : NORMAL;
    c.nextAt = now() + interval;
  }

  // warm-up history so trails are visible from the first frame
  const WARM = 40;   // reports since about 00:00
  for (let k = 0; k < WARM; k++) herd.forEach(c => { if (c !== lily) report(c, true); });
  herd.forEach(c => c.trail.forEach((p, i) => { p[2] = START - (c.trail.length - 1 - i) * NORMAL; }));
  lily.trail = [[600,420,START-74],[612,436,START-64],[628,445,START-54],[640,450,START-44],[650,470,START-34]]; lily.x = 650; lily.y = 470;
  herd.forEach(c => { if (c !== lily) { const t = c.trail[c.trail.length - 1]; c.x = t[0]; c.y = t[1]; } });

  function loop() {
    if (paused || drag) return;
    tick++;
    for (const c of herd) {
      if (now() >= c.nextAt) report(c);
      if (c.buzzing > 0) c.buzzing--;
      if (!c.stale && now() - c.last > STALE_AFTER) {
        c.stale = true;
        if (rules.find(r => r.id === 'r-stale').on) raise('warn', `${c.name} (#${c.tag}) has not reported for 30 min`, c.tag);
      }
    }
    if (!breakoutDone && tick === 14) breakout();
    render();
  }
  function breakout() {
    const c = herd[1];
    if (c.mode !== 'graze') return;
    breakoutDone = true;
    c.mode = 'escape';
    c.manualFast = now() + 60;   // tag reports "moving", so it reports every 2 min
    c.nextAt = Math.min(c.nextAt, now() + 2);
    toast('Demo: Moti (#02) is heading for a gap in the east fence…');
  }

  // ---------- rendering ----------
  const $ = id => document.getElementById(id);
  const svgNS = 'http://www.w3.org/2000/svg';
  const status = c => c.stale ? 'stale' : isOutside(c) ? 'out' : c.batt < 20 ? 'low' : 'in';
  const STATUS_TXT = { stale: 'No update', out: 'Outside', low: 'Low battery', in: 'Inside' };
  const STATUS_CLS = { stale: 'warn', out: 'crit', low: 'warn', in: 'ok' };
  const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));

  function renderMap() {
    $('fences').innerHTML = fences.map(f =>
      `<polygon class="${f.kind === 'keep_in' ? 'f-keep' : 'f-out'}" points="${f.pts.map(p => p.join(',')).join(' ')}"/>`
    ).join('') +
      `<text class="m-label" x="300" y="200">Main paddock</text>` +
      `<text class="m-label" x="895" y="215" text-anchor="middle" style="fill:var(--crit)">Maize · keep out</text>`;

    $('handles').innerHTML = editMode ? fence('main').pts.map((p, i) =>
      `<circle class="f-handle" data-i="${i}" cx="${p[0]}" cy="${p[1]}" r="11"><title>Drag to move this corner</title></circle>`).join('') : '';

    const sel = herd.find(c => c.tag === selected);
    const ptsOf = list => list.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
    if (simple()) {   // only the tapped cow's full route, drawn bold with time marks every 2 h
      const c = herd.find(x => x.tag === routeTag);
      const u = 1 / pxPerUnit();
      $('trails').innerHTML = !c ? '' :
        `<polyline class="route ${status(c) === 'out' ? 'out' : ''}" points="${ptsOf(c.trail.concat([[c.x, c.y]]))}" style="stroke-width:${(5 * u).toFixed(2)}"/>` +
        c.trail.filter((p, i) => i > 0 && Math.floor(p[2] / 120) !== Math.floor(c.trail[i - 1][2] / 120)).map(p =>
          `<circle class="route-tick" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${(5 * u).toFixed(2)}"/>` +
          `<text class="route-time" x="${(p[0] + 8 * u).toFixed(1)}" y="${(p[1] - 6 * u).toFixed(1)}" style="font-size:${(13 * u).toFixed(2)}px;stroke-width:${(3 * u).toFixed(2)}px">${fmt(p[2])}</text>`).join('') +
        `<circle class="route-start" cx="${c.trail[0][0].toFixed(1)}" cy="${c.trail[0][1].toFixed(1)}" r="${(8 * u).toFixed(2)}" style="stroke-width:${(3 * u).toFixed(2)}"/>` +
        `<text class="route-time" x="${(c.trail[0][0] + 12 * u).toFixed(1)}" y="${(c.trail[0][1] + 5 * u).toFixed(1)}" style="font-size:${(15 * u).toFixed(2)}px;stroke-width:${(3 * u).toFixed(2)}px;font-weight:700">Start ${fmt(c.trail[0][2])}</text>`;
    } else {   // advanced: selected cow's full day; "All trails" adds everyone's last 2 h
      $('trails').innerHTML = herd.filter(c => allTrails || c === sel).map(c => {
        const list = c === sel ? c.trail : c.trail.slice(-12);
        const dots = c === sel ? list.slice(0, -1).map(p => `<circle class="trail-pt" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.5"/>`).join('') : '';
        return `<polyline class="trail ${c === sel ? 'sel' : ''}" points="${ptsOf(list)}"/>${dots}`;
      }).join('');
    }
    renderRouteCard();

    $('handheld').innerHTML =
      (sel ? `<line class="link" x1="${HANDHELD.x}" y1="${HANDHELD.y}" x2="${sel.x.toFixed(1)}" y2="${sel.y.toFixed(1)}"/>` : '') +
      `<rect class="hh-body" x="${HANDHELD.x - 8}" y="${HANDHELD.y - 12}" width="16" height="24" rx="4"/>` +
      `<text class="m-small" x="${HANDHELD.x + 14}" y="${HANDHELD.y + 18}" font-weight="600">Handheld</text>`;

    // markers and the house keep a constant on-screen size whatever the zoom
    const k = markerPx() / 14 / pxPerUnit();
    $('home').setAttribute('transform', `scale(${(k * (simple() ? 1.15 : 0.95)).toFixed(3)})`);

    const g = $('cows');
    herd.forEach(c => {
      let el = g.querySelector(`[data-tag="${c.tag}"]`);
      if (!el) {
        el = document.createElementNS(svgNS, 'g');
        el.setAttribute('data-tag', c.tag);
        el.setAttribute('tabindex', '0');
        el.setAttribute('role', 'button');
        el.innerHTML = `<g class="ci"><g class="fx"></g><circle class="ring" r="21"/><circle class="body" r="14"/><text class="num">${c.tag}</text><text class="name" x="0" y="29"></text></g>`;
        g.appendChild(el);
      }
      const st = status(c);
      el.querySelector('.ci').setAttribute('transform', `scale(${k.toFixed(3)})`);
      const label = simple() && st === 'out' ? `${c.name} · outside` : simple() && st === 'stale' ? `${c.name} · no signal` : c.name;
      const nameEl = el.querySelector('.name');
      if (nameEl.textContent !== label) nameEl.textContent = label;
      nameEl.style.fill = simple() && st === 'out' ? 'var(--crit)' : '';
      el.setAttribute('class', 'cow' + (st === 'out' ? ' out' : '') + (st === 'stale' ? ' stale' : '') + (c.tag === selected ? ' sel' : ''));
      el.setAttribute('aria-label', `${c.name}, tag ${c.tag}, ${STATUS_TXT[st]}`);
      el.style.transform = `translate(${c.x.toFixed(1)}px, ${c.y.toFixed(1)}px)`;
      const fx = el.querySelector('.fx');
      const want = c.buzzing > 0 ? 'buzz' : st === 'out' ? 'out' : '';
      if (fx.dataset.k !== want) {
        fx.dataset.k = want;
        fx.innerHTML = want ? `<circle class="pulse ${want === 'buzz' ? 'buzz' : ''}" r="14"/>` : '';
      }
      if (c.tag === selected && g.lastChild !== el) g.appendChild(el);
    });
  }

  function renderRouteCard() {
    const card = $('routeCard'), c = simple() && herd.find(x => x.tag === routeTag);
    card.hidden = !c;
    if (!c) return;
    const st = status(c);
    const html = `<h2>${esc(c.name)}${st === 'out' ? ' · <span style="color:var(--crit)">outside</span>' : ''}</h2>` +
      `<p class="big">Walked ${fmtKm(routeMetres(c))} since ${fmt(c.trail[0][2])}</p>` +
      `<p>Last seen ${ago(c.last)}</p>` +
      `<button type="button" id="routeClose">Show all cows</button>`;
    if (card.dataset.html !== html) { card.dataset.html = html; card.innerHTML = html; }
  }

  // Simple view: one plain sentence about the whole herd. Tapping it zooms to whoever needs attention.
  function renderStatusLine() {
    const out = herd.filter(c => status(c) === 'out'), stale = herd.filter(c => status(c) === 'stale');
    const names = list => list.map(c => c.name).join(list.length === 2 ? ' and ' : ', ');
    const safe = herd.length - out.length - stale.length;
    let cls, icon, main, sub;
    if (out.length) {
      cls = 'crit'; icon = '!';
      main = `${names(out)} ${out.length === 1 ? 'is' : 'are'} outside the fence`;
      sub = `Tap to see where. ${safe} of ${herd.length} cows are safe.`;
    } else if (stale.length) {
      cls = 'warn'; icon = '?';
      main = `${names(stale)} ${stale.length === 1 ? 'has' : 'have'} no signal`;
      sub = `Last seen ${ago(Math.min(...stale.map(c => c.last)))}. The other ${safe} are safe.`;
    } else {
      cls = 'ok'; icon = '✓';
      main = `All ${herd.length} cows are safe`;
      sub = `Inside the fence · updated ${fmt(now())}`;
    }
    const el = $('statusLine');
    el.className = `status-line simple-only ${cls}`;
    el.innerHTML = `<span class="ico" aria-hidden="true">${icon}</span><span>${esc(main)}<small>${esc(sub)}</small></span>`;
    el.dataset.focus = (out.length ? out : stale).map(c => c.tag).join(',');
  }

  function renderStats() {
    const counts = { in: 0, out: 0, stale: 0, low: 0 };
    herd.forEach(c => counts[status(c)]++);
    const open = alerts.filter(a => !a.acked).length;
    $('stats').innerHTML =
      `<span class="pill"><i class="dot ok"></i>Home beacon online</span>` +
      `<span class="pill clock">${fmt(now())} · ${paused ? 'paused' : 'live'}</span>` +
      `<span class="pill">${herd.length} tagged</span>` +
      `<span class="pill ok">${counts.in + counts.low} inside</span>` +
      (counts.out ? `<span class="pill crit">${counts.out} outside</span>` : '') +
      (counts.stale ? `<span class="pill warn">${counts.stale} no update</span>` : '');
    const b = $('alertBadge');
    b.hidden = !open; b.textContent = open;
  }

  function battHTML(c) {
    return `<span class="batt ${c.batt < 20 ? 'low' : ''}" style="--p:${Math.max(4, c.batt)}"><i></i>${Math.round(c.batt)}%</span>`;
  }

  function selectedCard() {
    const c = herd.find(x => x.tag === selected);
    if (!c) return `<p class="hint">Tap a tag on the map or a row below to see its details.</p>`;
    const st = status(c);
    const fastOn = c.fast || c.manualFast > now();
    const next = c.stale ? 'waiting for the tag to report' : `next report in about ${Math.max(1, Math.round(c.nextAt - now()))} min${fastOn ? ' (fast mode)' : ''}`;
    const hd = Math.round(dist(HANDHELD, c));
    return `<div class="card">
      <div class="card-head">
        <span class="tagchip"><span>${c.tag}</span></span>
        <div><h2>${esc(c.name)}</h2><p>Last fix ${fmt(c.last)} · ${ago(c.last)}</p></div>
        <span class="pill ${STATUS_CLS[st]}">${STATUS_TXT[st]}</span>
      </div>
      <dl class="facts">
        <div><dt>Position</dt><dd>${toLatLon(c)}</dd></div>
        <div><dt>Battery</dt><dd>${Math.round(c.batt)} % · ${volts(c.batt)} V</dd></div>
        <div><dt>Signal at house</dt><dd>${c.stale ? '—' : `${c.rssi} dBm · SNR ${c.snr}`}</dd></div>
        <div><dt>GPS</dt><dd>${c.stale ? 'no fix' : `${c.sats} sats · HDOP ${c.hdop}`}</dd></div>
        <div><dt>From house</dt><dd>${Math.round(dist(HOUSE, c))} m ${compass(HOUSE, c)}</dd></div>
        <div><dt>From handheld</dt><dd>${hd} m ${compass(HANDHELD, c)}</dd></div>
        <div><dt>Walked today</dt><dd>${fmtKm(routeMetres(c))} since ${fmt(c.trail[0][2])}</dd></div>
      </dl>
      <div class="actions">
        <button class="btn primary" type="button" data-act="buzz" ${c.buzzQ ? 'disabled' : ''}>${c.buzzQ ? 'Buzz queued' : 'Find (buzz 30 s)'}</button>
        <button class="btn" type="button" data-act="fast" aria-pressed="${c.manualFast > now()}">Track every 2 min</button>
        ${st === 'out' && c.mode !== 'return' ? `<button class="btn" type="button" data-act="return">Herd back (demo)</button>` : ''}
      </div>
      <p class="hint">${next}. Commands go out right after the tag's next report.</p>
    </div>`;
  }

  function herdPane() {
    const order = { out: 0, stale: 1, low: 2, in: 3 };
    const rows = [...herd].sort((a, b) => order[status(a)] - order[status(b)] || a.tag.localeCompare(b.tag)).map(c => {
      const st = status(c);
      const what = c.stale ? 'No update' : c.activity > 120 ? 'Walking' : c.activity > 50 ? 'Grazing' : 'Resting';
      return `<button class="row" type="button" data-sel="${c.tag}" aria-current="${c.tag === selected}">
        <span class="tagchip"><span>${c.tag}</span></span>
        <span><strong>${esc(c.name)}</strong><small>${what} · ${ago(c.last)}</small></span>
        <span class="row-end"><span class="pill ${STATUS_CLS[st]}">${STATUS_TXT[st]}</span>${battHTML(c)}</span>
      </button>`;
    }).join('');
    return `<section class="sec">${selectedCard()}</section>
      <section class="sec"><h3 class="eyebrow">Herd · ${herd.length} animals</h3><div class="list">${rows}</div></section>`;
  }

  function alertsPane() {
    const sevTxt = { crit: 'Critical', warn: 'Warning', info: 'Info' };
    const list = alerts.map(a => `<div class="alert ${a.sev} ${a.acked ? 'acked' : ''}">
        <span class="stripe"></span>
        <div><p class="msg">${esc(a.msg)}</p>
          <p class="meta">${sevTxt[a.sev]} · ${fmt(a.at)}${a.acked ? ` · acknowledged ${fmt(a.ackAt)}` : ''}</p></div>
        <div class="actions">${a.tag ? `<button class="btn" type="button" data-show="${a.tag}">Show</button>` : ''}${a.acked ? '' : `<button class="btn" type="button" data-ack="${a.id}">Ack</button>`}</div>
      </div>`).join('');
    const ruleRows = rules.map(r => `<div class="rule">
        <label for="${r.id}">${r.name}<small>${r.desc}</small></label>
        <input class="switch" type="checkbox" id="${r.id}" data-rule="${r.id}" ${r.on ? 'checked' : ''}>
      </div>`).join('');
    return `<section class="sec"><h3 class="eyebrow">Recent</h3><div>${list || '<p class="hint">No alerts yet.</p>'}</div></section>
      <section class="sec"><h3 class="eyebrow">Alert rules</h3><div>${ruleRows}</div>
      <p class="hint">Sent to: app notification, Telegram. Critical alerts repeat every 10 min until someone acknowledges them.</p></section>`;
  }

  function fencesPane() {
    const rows = fences.map(f => {
      const ha = (area(f.pts) / 10000).toFixed(2);
      const inside = herd.filter(c => inPoly(c.x, c.y, f.pts)).length;
      return `<div class="fence">
        <span class="ico ${f.kind === 'keep_out' ? 'out' : ''}"></span>
        <span><strong>${f.name}</strong><small>${f.kind === 'keep_in' ? 'Keep in' : 'Keep out'} · ${ha} ha · ${Math.round(perimeter(f.pts))} m perimeter · ${inside} animal${inside === 1 ? '' : 's'} inside</small></span>
        ${f.kind === 'keep_in' ? `<button class="btn" type="button" data-act="edit" aria-pressed="${editMode}">${editMode ? 'Done' : 'Edit'}</button>` : ''}
      </div>`;
    }).join('');
    return `<section class="sec"><h3 class="eyebrow">Geofences</h3>${rows}
      <p class="hint">${editMode ? 'Drag the round handles on the map to move the paddock corners. Area and alerts update as you drag.' : 'Edit the paddock to see area and alerts update live. A real app would also let you draw new polygons and circles.'}</p>
      <div class="actions"><button class="btn" type="button" disabled>New fence</button><button class="btn" type="button" disabled>Night schedule</button></div></section>`;
  }

  function devicesPane() {
    const rows = herd.map(c => `<tr><td><strong>#${c.tag}</strong> ${esc(c.name)}</td><td class="mono">${volts(c.batt)} V</td><td class="mono">${c.stale ? '—' : c.rssi}</td><td>${ago(c.last)}</td></tr>`).join('');
    return `<section class="sec"><h3 class="eyebrow">Home beacon</h3>
      <dl class="kv">
        <dt>Status</dt><dd style="color:var(--ok)">Online</dd>
        <dt>Power</dt><dd>Mains · backup 100 %</dd>
        <dt>Uptime</dt><dd>12 d 4 h</dd>
        <dt>WiFi</dt><dd>−61 dBm</dd>
        <dt>Packets this session</dt><dd>${packetsHour}</dd>
        <dt>Queued commands</dt><dd>${herd.filter(c => c.buzzQ).length}</dd>
        <dt>Radio</dt><dd>865.0625 MHz · SF9 · 125 kHz</dd>
        <dt>Firmware</dt><dd>gw 0.1.0 / rak 0.1.0</dd>
      </dl></section>
      <section class="sec"><h3 class="eyebrow">Handheld beacon</h3>
      <dl class="kv">
        <dt>Battery</dt><dd>81 % · 3.98 V</dd>
        <dt>GPS</dt><dd>10 sats</dd>
        <dt>Position</dt><dd>${toLatLon(HANDHELD)}</dd>
        <dt>Pointing at</dt><dd>#${selected}</dd>
      </dl></section>
      <section class="sec"><h3 class="eyebrow">Collar tags</h3>
      <div class="tbl-wrap"><table><thead><tr><th>Tag</th><th>Battery</th><th>RSSI</th><th>Last seen</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
  }

  function renderPane() {
    document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.tab === tab));
    const pane = $('pane');
    pane.setAttribute('aria-labelledby', 'tab-' + tab);
    const focusKey = document.activeElement && pane.contains(document.activeElement) ? keyOf(document.activeElement) : null;
    pane.innerHTML = { herd: herdPane, alerts: alertsPane, fences: fencesPane, devices: devicesPane }[tab]();
    if (focusKey) { const el = pane.querySelector(focusKey); if (el) el.focus({ preventScroll: true }); }
  }
  const keyOf = el => {
    for (const a of ['data-sel', 'data-act', 'data-ack', 'data-show', 'data-rule']) if (el.hasAttribute(a)) return `[${a}="${el.getAttribute(a)}"]`;
    return null;
  };

  function render() {
    renderMap(); renderStats(); renderStatusLine(); renderPane();
    $('tEdit').setAttribute('aria-pressed', editMode);
    $('tTrails').setAttribute('aria-pressed', allTrails);
    $('tPause').setAttribute('aria-pressed', paused);
    $('tPause').textContent = paused ? 'Resume' : 'Pause';
    $('tBreak').disabled = herd[1].mode !== 'graze';
  }

  function toast(msg) {
    const t = $('toast');
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, 3800);
  }

  // ---------- view: zoom + pan (viewBox in metres, always matching the map box's shape) ----------
  const svg = $('map');
  const view = { cx: 500, cy: 350, w: 1000 };
  const MIN_W = 120, MAX_W = 1400;
  const mapSize = () => { const r = svg.getBoundingClientRect(); return { w: r.width || 1, h: r.height || 1 }; };
  const pxPerUnit = () => mapSize().w / view.w;
  const markerPx = () => simple() ? (mapSize().w < 500 ? 14 : 17) : 11;   // marker radius on screen
  function applyView() {
    const s = mapSize(), h = view.w * s.h / s.w;
    view.cx = Math.max(0, Math.min(1000, view.cx));
    view.cy = Math.max(0, Math.min(700, view.cy));
    svg.setAttribute('viewBox', `${(view.cx - view.w / 2).toFixed(1)} ${(view.cy - h / 2).toFixed(1)} ${view.w.toFixed(1)} ${h.toFixed(1)}`);
    renderMap();
  }
  function fitBox(x0, y0, x1, y1, padPx, bottomPx = 0) {   // padPx: margin so markers aren't cut off; bottomPx: room for a card
    const s = mapSize();
    const fx = Math.max(0.3, 1 - 2 * padPx / s.w), fy = Math.max(0.3, 1 - (2 * padPx + bottomPx) / s.h);
    view.w = Math.max(MIN_W, Math.min(MAX_W, Math.max((x1 - x0) / fx, (y1 - y0) / fy * s.w / s.h)));
    view.cx = (x0 + x1) / 2;
    view.cy = (y0 + y1) / 2 + bottomPx / 2 * view.w / s.w;
    applyView();
  }
  function showAll() {
    if (!simple()) return fitBox(0, 0, 1000, 700, 0);
    const xs = herd.map(c => c.x).concat(135), ys = herd.map(c => c.y).concat(660);
    fitBox(Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys), 64);
  }
  function zoomAt(factor, sx, sy) {   // sx, sy: point in map units that stays put
    const nw = Math.max(MIN_W, Math.min(MAX_W, view.w / factor)), f = nw / view.w;
    if (sx !== undefined) { view.cx = sx + (view.cx - sx) * f; view.cy = sy + (view.cy - sy) * f; }
    view.w = nw;
    applyView();
  }
  const toSvg = (x, y) => { const p = svg.createSVGPoint(); p.x = x; p.y = y; return p.matrixTransform(svg.getScreenCTM().inverse()); };

  $('zIn').addEventListener('click', () => zoomAt(1.6));
  $('zOut').addEventListener('click', () => zoomAt(1 / 1.6));
  $('zAll').addEventListener('click', showAll);
  svg.addEventListener('wheel', e => { e.preventDefault(); const p = toSvg(e.clientX, e.clientY); zoomAt(Math.pow(1.0015, -e.deltaY), p.x, p.y); }, { passive: false });

  // one finger / mouse drags the map, two fingers pinch-zoom
  const pointers = new Map();
  let panMoved = false, pinchDist = 0;
  svg.addEventListener('pointerdown', e => {
    if (e.target.closest('.f-handle')) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1) panMoved = false;
    if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinchDist = Math.hypot(a.x - b.x, a.y - b.y); }
  });
  window.addEventListener('pointermove', e => {
    const prev = pointers.get(e.pointerId);
    if (!prev || drag) return;
    const cur = { x: e.clientX, y: e.clientY };
    if (pointers.size === 1) {
      if (!panMoved && Math.hypot(cur.x - prev.x, cur.y - prev.y) < 6) return;
      panMoved = true;
      const u = 1 / pxPerUnit();
      view.cx -= (cur.x - prev.x) * u; view.cy -= (cur.y - prev.y) * u;
      pointers.set(e.pointerId, cur);
      applyView();
    } else if (pointers.size === 2) {
      pointers.set(e.pointerId, cur);
      const [a, b] = [...pointers.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (pinchDist) { const m = toSvg((a.x + b.x) / 2, (a.y + b.y) / 2); zoomAt(d / pinchDist, m.x, m.y); }
      pinchDist = d; panMoved = true;
    }
  });
  let lastTap = { t: 0, x: 0, y: 0 };
  const dropPointer = e => {
    const wasTap = pointers.has(e.pointerId) && pointers.size === 1 && !panMoved && e.type === 'pointerup';
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinchDist = 0;
    if (!wasTap || e.target.closest && e.target.closest('.cow')) return;
    const now = performance.now();
    if (now - lastTap.t < 350 && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 30) {   // double-tap: zoom in there
      const p = toSvg(e.clientX, e.clientY);
      zoomAt(2, p.x, p.y);
      lastTap.t = 0;
    } else {
      lastTap = { t: now, x: e.clientX, y: e.clientY };
    }
  };
  window.addEventListener('pointerup', dropPointer);
  window.addEventListener('pointercancel', dropPointer);
  new ResizeObserver(() => applyView()).observe($('map').parentElement);

  // ---------- simple / advanced mode ----------
  function simple() { return document.documentElement.dataset.mode === 'simple'; }
  function setMode(mode) {
    document.documentElement.dataset.mode = mode;
    $('modeBtn').textContent = mode === 'simple' ? 'Advanced ›' : '‹ Simple view';
    $('modeBtn').setAttribute('aria-label', mode === 'simple' ? 'Open advanced view with herd list, alerts and fences' : 'Back to simple map view');
    if (mode === 'simple') editMode = false;
    routeTag = null;
    try { localStorage.setItem('ctv1-mode', mode); } catch (e) {}
    requestAnimationFrame(() => { showAll(); render(); });
  }
  $('statusLine').addEventListener('click', () => {
    const tags = $('statusLine').dataset.focus;
    if (!tags) return showAll();
    const list = herd.filter(c => tags.split(',').includes(c.tag));
    if (list.length === 1) { view.cx = list[0].x; view.cy = list[0].y; view.w = Math.min(view.w, 360); applyView(); }
    else fitBox(Math.min(...list.map(c => c.x)), Math.min(...list.map(c => c.y)), Math.max(...list.map(c => c.x)), Math.max(...list.map(c => c.y)), 64);
  });
  $('modeBtn').addEventListener('click', () => setMode(simple() ? 'advanced' : 'simple'));

  // ---------- interactions ----------
  function select(tag) {
    if (simple()) {   // simple view: tapping a cow shows its full route for today
      const c = herd.find(x => x.tag === tag);
      routeTag = tag;
      const xs = c.trail.map(p => p[0]).concat(c.x), ys = c.trail.map(p => p[1]).concat(c.y);
      fitBox(Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys), 60, mapSize().w < 500 ? 150 : 110);
      return;
    }
    selected = tag; tab = 'herd'; render();
  }
  $('routeCard').addEventListener('click', e => { if (e.target.id === 'routeClose') { routeTag = null; showAll(); } });
  $('cows').addEventListener('click', e => {
    const g = e.target.closest('.cow');
    if (!g || panMoved) return;
    if (e.detail) g.blur();   // tapped or clicked, not keyboard: no focus box
    select(g.dataset.tag);
  });
  $('cows').addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.closest('.cow')) { e.preventDefault(); select(e.target.closest('.cow').dataset.tag); } });

  document.querySelector('.tabs').addEventListener('click', e => { const t = e.target.closest('.tab'); if (t) { tab = t.dataset.tab; render(); } });

  $('pane').addEventListener('click', e => {
    const el = e.target.closest('button'); if (!el) return;
    if (el.dataset.sel) { selected = el.dataset.sel; render(); return; }
    if (el.dataset.show) { select(el.dataset.show); return; }
    if (el.dataset.ack) { const a = alerts.find(x => x.id === +el.dataset.ack); a.acked = true; a.ackAt = now(); render(); return; }
    const c = herd.find(x => x.tag === selected);
    if (el.dataset.act === 'buzz' && c) {
      c.buzzQ = true;
      toast(c.stale ? `${c.name} has not reported for ${Math.round(now() - c.last)} min. The buzz will wait; take the handheld towards its last fix.` : `Buzz queued for ${c.name}. It goes out after the next report (about ${Math.max(1, Math.round(c.nextAt - now()))} min).`);
    }
    if (el.dataset.act === 'fast' && c) {
      c.manualFast = c.manualFast > now() ? 0 : now() + 180;
      toast(c.manualFast ? `${c.name} will report every 2 min for 3 h (uses more battery).` : `${c.name} back to normal 10 min reports.`);
    }
    if (el.dataset.act === 'return' && c) { c.mode = 'return'; toast(`Walking ${c.name} back to the paddock.`); }
    if (el.dataset.act === 'edit') { editMode = !editMode; }
    render();
  });
  $('pane').addEventListener('change', e => {
    const r = rules.find(x => x.id === e.target.dataset.rule);
    if (r) { r.on = e.target.checked; toast(`${r.name}: ${r.on ? 'on' : 'off'}`); }
  });

  $('tEdit').addEventListener('click', () => { editMode = !editMode; if (editMode) tab = 'fences'; render(); });
  $('tTrails').addEventListener('click', () => { allTrails = !allTrails; render(); });
  $('tPause').addEventListener('click', () => { paused = !paused; render(); });
  $('tBreak').addEventListener('click', () => { breakoutDone = false; breakout(); render(); });

  // fence vertex dragging (window listeners so re-renders never drop the drag)
  $('handles').addEventListener('pointerdown', e => {
    const h = e.target.closest('.f-handle'); if (!h) return;
    e.preventDefault(); drag = { i: +h.dataset.i };
  });
  window.addEventListener('pointermove', e => {
    if (!drag) return;
    const p = toSvg(e.clientX, e.clientY);
    fence('main').pts[drag.i] = [Math.max(0, Math.min(1000, Math.round(p.x))), Math.max(0, Math.min(700, Math.round(p.y)))];
    renderMap(); if (tab === 'fences') renderPane();
  });
  window.addEventListener('pointerup', () => {
    if (!drag) return;
    drag = null;
    herd.forEach(c => { if (!c.stale) checkFences(c); });
    render();
  });

  let startMode = 'simple';
  try { startMode = localStorage.getItem('ctv1-mode') || 'simple'; } catch (e) {}
  if (location.hash === '#advanced' || location.hash === '#simple') startMode = location.hash.slice(1);
  setMode(startMode);
  setInterval(loop, 1000);
})();
</script>
